<template>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/Geist-Medium.woff2") format("woff2"); font-weight: 500; }
    @font-face { font-family: "Chakra Petch"; src: url("assets/fonts/ChakraPetch-700.woff2") format("woff2"); font-weight: 700; }
    #root { position: absolute; inset: 0; }
    /* the end card, Outbreak's way: logo, one line, the URL; on the brand's own ground */
    #s6-mark { position: absolute; left: 830px; top: 246px; width: 260px; height: 260px; overflow: visible; }
    #s6-wm { position: absolute; left: 0; top: 546px; width: 1920px; text-align: center; font-family: "Chakra Petch", sans-serif; font-weight: 700; font-size: 76px; letter-spacing: 0.12em; padding-left: 0.12em; color: var(--ink); white-space: nowrap; }
    #s6-wm .w { display: inline-block; }
    #s6-line { position: absolute; left: 0; top: 690px; width: 1920px; text-align: center; font-weight: 500; font-size: 36px; letter-spacing: -0.01em; color: var(--ink-70); white-space: nowrap; }
    #s6-url { position: absolute; left: 0; top: 764px; width: 1920px; text-align: center; font-weight: 500; font-size: 28px; color: var(--green-text); white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s6-end" data-width="1920" data-height="1080">
    <svg id="s6-mark" viewBox="0 0 120 120" aria-label="Secure Data Hub mark">
      <defs>
        <mask id="s6-kh" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
          <rect x="0" y="0" width="120" height="120" fill="#fff" />
          <circle cx="60" cy="56" r="5" fill="#000" />
          <rect x="57.5" y="57" width="5" height="11" rx="2" fill="#000" />
        </mask>
      </defs>
      <!-- clockwise from the top left -->
      <g fill="none" stroke="#0E2433" stroke-width="6">
        <rect class="s6-sq" x="13" y="13" width="22" height="22" rx="5" />
        <rect class="s6-sq" x="49" y="13" width="22" height="22" rx="5" />
        <rect class="s6-sq" x="85" y="13" width="22" height="22" rx="5" />
        <rect class="s6-sq" x="85" y="49" width="22" height="22" rx="5" />
        <rect class="s6-sq" x="85" y="85" width="22" height="22" rx="5" />
        <rect class="s6-sq" x="49" y="85" width="22" height="22" rx="5" />
        <rect class="s6-sq" x="13" y="85" width="22" height="22" rx="5" />
        <rect class="s6-sq" x="13" y="49" width="22" height="22" rx="5" />
      </g>
      <rect id="s6-ctr" x="46" y="46" width="28" height="28" rx="6" fill="#0F9D74" mask="url(#s6-kh)" />
    </svg>
    <div id="s6-wm"><span class="w">SECURE</span> <span class="w">DATA</span> <span class="w">HUB</span></div>
    <div id="s6-line">Breaking into the app doesn't expose the data.</div>
    <div id="s6-url">github.com/andyyaro/Building-A-Secure-Data-Hub-in-the-cloud-AWS-</div>
  </div>
  <script>
    (function () {
      const TM = window.TM, VO = window.VO;
      const S0 = TM.s6[0];
      const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
      const W = (k, w, nth = 0) => {
        const alts = w.split("|");
        for (const exact of [true, false]) {
          let c = 0;
          for (const x of VO[k].words) {
            const t = norm(x.w);
            if (alts.some((a) => (exact ? t === a : t.startsWith(a)))) { if (c === nth) return x.t0 - S0; c++; }
          }
        }
        return VO[k].start - S0;
      };
      const tl = gsap.timeline({ paused: true });
      const rise = (el, t, d = 0.5, dy = 22) =>
        tl.fromTo(el, { opacity: 0, y: dy, filter: "blur(5px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: "power3.out" }, t - 0.04);

      gsap.set([".s6-sq", "#s6-ctr", "#s6-wm .w", "#s6-line", "#s6-url"], { opacity: 0 });
      gsap.set([".s6-sq", "#s6-ctr"], { transformOrigin: "50% 50%" });
      // the eight records arrive clockwise, then the key at the centre
      tl.fromTo(".s6-sq", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.8)", stagger: 0.075 }, 0.3);
      const c = 0.3 + 0.075 * 8 + 0.15;
      tl.fromTo("#s6-ctr", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, c);
      rise("#s6-wm .w:nth-child(1)", W("v13", "secure"), 0.5, 18);
      rise("#s6-wm .w:nth-child(2)", W("v13", "data"), 0.5, 18);
      rise("#s6-wm .w:nth-child(3)", W("v13", "hub"), 0.5, 18);
      rise("#s6-line", W("v13", "hub") + 0.7, 0.55, 14);
      rise("#s6-url", W("v13", "hub") + 1.3, 0.55, 10);
      window.__timelines["s6-end"] = tl;
    })();
  </script>
