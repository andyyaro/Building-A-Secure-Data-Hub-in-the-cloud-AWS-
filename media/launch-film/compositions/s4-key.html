  </style>

      <div class="lab">ClientsBase · one item</div>
      <div id="s4-row0" class="s4-row">id<span class="v">25xwe2</span></div>
      <div id="s4-row1" class="s4-row">firstName
        <span class="v s4-enc"><svg class="s4-lock" viewBox="0 0 22 26"><rect x="1" y="11" width="20" height="14" rx="3" fill="#0E2433" /><path d="M5 11 V7 a6 6 0 0 1 12 0 V11" fill="none" stroke="#0E2433" stroke-width="3" /></svg><span class="s4-bar" style="width: 170px"></span></span>
        <span class="s4-plain">Ada</span></div>
      <div id="s4-row2" class="s4-row">lastName
        <span class="v s4-enc"><svg class="s4-lock" viewBox="0 0 22 26"><rect x="1" y="11" width="20" height="14" rx="3" fill="#0E2433" /><path d="M5 11 V7 a6 6 0 0 1 12 0 V11" fill="none" stroke="#0E2433" stroke-width="3" /></svg><span class="s4-bar" style="width: 230px"></span></span>
        <span class="s4-plain">Lovelace</span></div>
      <div id="s4-row3" class="s4-row">signature

        <rect x="13" y="13" width="22" height="22" rx="5" /><rect x="49" y="13" width="22" height="22" rx="5" /><rect x="85" y="13" width="22" height="22" rx="5" />
        <rect x="13" y="49" width="22" height="22" rx="5" /><rect x="49" y="49" width="22" height="22" rx="5" /><rect x="85" y="49" width="22" height="22" rx="5" />
        <rect x="13" y="85" width="22" height="22" rx="5" /><rect x="49" y="85" width="22" height="22" rx="5" /><rect x="85" y="85" width="22" height="22" rx="5" /></g></svg>
      <span class="t">ClientsSummary<span class="s">id, firstName, lastName</span></span>
    </div>
    <div id="s4-base" class="node s4-tbl">
      <svg viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="#0E2433" stroke-width="9">
        <rect x="13" y="13" width="22" height="22" rx="5" /><rect x="49" y="13" width="22" height="22" rx="5" /><rect x="85" y="13" width="22" height="22" rx="5" />
        <rect x="13" y="49" width="22" height="22" rx="5" /><rect x="85" y="49" width="22" height="22" rx="5" />
        <rect x="13" y="85" width="22" height="22" rx="5" /><rect x="49" y="85" width="22" height="22" rx="5" /><rect x="85" y="85" width="22" height="22" rx="5" /></g>
        <rect id="s4-bctr" x="46" y="46" width="28" height="28" rx="6" fill="#0F9D74" /></svg>
      <span class="t">ClientsBase<span class="s">encrypted PII, GetItem only</span></span>

    <div id="s4-lim" class="cw"><span class="chip g">Scan · limit 20</span></div>
    <div id="s4-deny2" class="deny"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 3 L17 17 M17 3 L3 17" stroke="#fff" stroke-width="4" stroke-linecap="round" /></svg></div>

    <div id="s4-dot3" class="dot"></div>

  <script>
    (function () {
      const TM = window.TM, VO = window.VO;
      const S0 = TM.s4[0], S1 = TM.s4[1];
      const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
      const W = (k, w, nth = 0) => {
        const alts = w.split("|");
        for (const exact of [true, false]) {
          let c = 0;
          for (const x of VO[k].words) {
            const t = norm(x.w);
            if (alts.some((a) => (exact ? t === a : t.startsWith(a)))) { if (c === nth) return x.t0 - S0; c++; }
          }
        }
        return VO[k].start - S0;
      };
      const F = (t) => t - S0;
      const INK = "#0E2433", GREEN = "#0F9D74";
      const tl = gsap.timeline({ paused: true });
      const rise = (el, t, d = 0.5, dy = 22) =>
        tl.fromTo(el, { opacity: 0, y: dy, filter: "blur(5px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: "power3.out" }, t - 0.04);
      const fade = (el, t, d = 0.4) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d, ease: "power2.out" }, t);
      const pop = (el, t, d = 0.45) => tl.fromTo(el, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(1.7)" }, t);
      const out = (els, t, d = 0.3) => tl.to(els, { opacity: 0, filter: "blur(5px)", duration: d, ease: "power3.in" }, t);
      // red dashes along a path of horizontal and vertical segments, in drawing order
      const dashPath = (hostSel, pts) => {
        const host = document.querySelector(hostSel), segs = [];
        for (let i = 0; i + 1 < pts.length; i++) {
          const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
          const len = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / len, uy = (y1 - y0) / len;
          for (let s = 0; s + 10 <= len; s += 18) {
            const d = document.createElement("div");
            d.className = "dash-seg";
            const x = x0 + ux * s, y = y0 + uy * s;
            d.style.cssText = ux !== 0
              ? `left:${Math.min(x, x + ux * 10)}px;top:${y - 2}px;width:10px;height:4px`
              : `left:${x - 2}px;top:${Math.min(y, y + uy * 10)}px;width:4px;height:10px`;
            host.appendChild(d); segs.push(d);
          }
        }
        return segs;
      };
      const dashA = dashPath("#s4-dashA", [[1396, 810], [1010, 810], [1010, 712]]);
      const dashB = dashPath("#s4-dashB", [[880, 622], [880, 770], [1218, 770]]);

      const A = ["#s4-kick", "#s4-head", "#s4-rec", "#s4-kms", "#s4-dr", "#s4-own", "#s4-ownsub", "#s4-deny", "#s4-g1", "#s4-g2", "#s4-note", ".s4-plain"];
      const B = ["#s4-kick2", "#s4-head2", "#s4-adm", "#s4-scan", "#s4-sum", "#s4-base", "#s4-lim", "#s4-deny2", "#s4-nog", "#s4-p1", "#s4-p2", "#s4-p3"];
      gsap.set(A.concat(B, dashA, dashB, ["#s4-dot1", "#s4-dot2", "#s4-dot3", ".s4-row", ".s4-lock"]), { opacity: 0 });
      gsap.set(["#s4-g1", "#s4-g2", "#s4-p1", "#s4-p3"], { scaleX: 0, opacity: 1 });
      gsap.set("#s4-p2", { scaleY: 0, opacity: 1 });
      gsap.set(".s4-bar", { scaleX: 0 });
      gsap.set("#s4-bctr", { transformOrigin: "50% 50%" });
      gsap.set("#s4-dot1", { x: 1400, y: 565 });
      gsap.set("#s4-dot2", { x: 820, y: 565 });
      gsap.set("#s4-dot3", { x: 520, y: 620 });

      // ---- frame A: "Each record is encrypted with a customer-managed key, used only as the data account."
      fade("#s4-kick", 0.15, 0.45);
      rise("#s4-head", W("v10", "each") - 0.08, 0.55, 20);
      pop("#s4-rec", W("v10", "record") - 0.05);
      tl.fromTo(".s4-row", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.08 }, W("v10", "record") + 0.1);
      const enc = W("v10", "encrypted");
      tl.to(".s4-bar", { scaleX: 1, duration: 0.45, ease: "power2.out", stagger: 0.1 }, enc);
      tl.fromTo(".s4-lock", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.1 }, enc + 0.05);
      pop("#s4-kms", W("v10", "customer"));
      pop("#s4-dr", W("v10", "key"));
      pop("#s4-own", W("v10", "key") + 0.15);
      // "used only as the data account": the data role reaches the key; the Lambda's own role is refused
      const u = W("v10", "used");
      tl.to("#s4-dr", { borderColor: GREEN, duration: 0.3 }, u);
      tl.to("#s4-g1", { scaleX: 1, duration: 0.45, ease: "power1.inOut" }, u);
      tl.to("#s4-dot1", { opacity: 1, duration: 0.1 }, u);
      tl.to("#s4-dot1", { x: 1200, duration: 0.45, ease: "power1.inOut" }, u);
      tl.to("#s4-dot1", { opacity: 0, duration: 0.1 }, u + 0.45);
      // ... and the item decrypts, for this one request
      const d = u + 0.45;
      tl.to("#s4-g2", { scaleX: 1, duration: 0.3, ease: "power1.inOut" }, d);
      tl.to("#s4-dot2", { opacity: 1, duration: 0.1 }, d);
      tl.to("#s4-dot2", { x: 700, duration: 0.3, ease: "power1.inOut" }, d);
      tl.to("#s4-dot2", { opacity: 0, duration: 0.1 }, d + 0.3);
      tl.to(".s4-enc", { opacity: 0, filter: "blur(4px)", duration: 0.25, stagger: 0.08 }, d + 0.3);
      tl.fromTo(".s4-plain", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.08 }, d + 0.4);
      tl.to("#s4-rec", { borderColor: GREEN, duration: 0.3 }, d + 0.35);
      fade("#s4-note", d + 0.6, 0.35);
      // "only as the data account": the Lambda's own role (the SDK's silent default) is refused
      const o = W("v10", "as");
      tl.to(dashA, { opacity: 1, duration: 0.05, stagger: 0.012 }, o);
      pop("#s4-deny", W("v10", "data") + 0.1, 0.4);
      fade("#s4-ownsub", W("v10", "data") + 0.25, 0.35);
      out(A.concat(dashA, [".s4-row", ".s4-lock"]), F(VO.v11.start) - 0.45, 0.3);

      // ---- frame B: "And the admin's broad permission never touches the sensitive table."
      fade("#s4-kick2", F(VO.v11.start) - 0.15, 0.4);
      rise("#s4-head2", W("v11", "the") - 0.08, 0.55, 20);
      pop("#s4-adm", W("v11", "admins"));
      pop("#s4-sum", W("v11", "admins") + 0.15);
      pop("#s4-base", W("v11", "admins") + 0.3);
      pop("#s4-scan", W("v11", "broad"), 0.4);
      const p = W("v11", "permission");
      tl.to("#s4-dot3", { opacity: 1, duration: 0.1 }, p);
      tl.to("#s4-p1", { scaleX: 1, duration: 0.3, ease: "power1.in" }, p);
      tl.to("#s4-dot3", { x: 880, duration: 0.3, ease: "power1.in" }, p);
      tl.to("#s4-p2", { scaleY: 1, duration: 0.25, ease: "none" }, p + 0.3);
      tl.to("#s4-dot3", { y: 490, duration: 0.25, ease: "none" }, p + 0.3);
      tl.to("#s4-p3", { scaleX: 1, duration: 0.35, ease: "power1.out" }, p + 0.55);
      tl.to("#s4-dot3", { x: 1238, duration: 0.35, ease: "power1.out" }, p + 0.55);
      tl.to("#s4-dot3", { opacity: 0, duration: 0.1 }, p + 0.9);
      tl.to("#s4-sum", { borderColor: GREEN, duration: 0.3 }, p + 0.88);
      fade("#s4-lim", p + 0.8, 0.35);
      const nv = W("v11", "never");
      tl.to(dashB, { opacity: 1, duration: 0.05, stagger: 0.022 }, nv);
      pop("#s4-deny2", W("v11", "touches") + 0.1, 0.4);
      fade("#s4-nog", W("v11", "touches") + 0.25, 0.35);
      tl.fromTo("#s4-bctr", { scale: 1 }, { scale: 1.22, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, W("v11", "sensitive"));

      out(B.concat(dashB), S1 - S0 - 0.35, 0.3);
      window.__timelines["s4-key"] = tl;
    })();
  </script>
