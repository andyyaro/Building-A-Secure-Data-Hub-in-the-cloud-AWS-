    <div id="s5-num" class="num">51</div>
    <div id="s5-head" class="head"><span class="w">tests pin these</span><br /><span class="w">boundaries in place.</span></div>

    <!-- six of the boundaries the suite pins (tests/test_*.py) -->
    <div class="s5-row" style="top: 262px"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#0F9D74" /><path d="M11 20.5 L17.5 27 L29.5 14" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /></svg>One role to assume, through STS</div>
    <div class="s5-row" style="top: 354px"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#0F9D74" /><path d="M11 20.5 L17.5 27 L29.5 14" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /></svg>No long-lived keys in the environment</div>
    <div class="s5-row" style="top: 446px"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#0F9D74" /><path d="M11 20.5 L17.5 27 L29.5 14" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" /></svg>Tenant ID only from the token's claim</div>

  <script>
    (function () {
      const TM = window.TM, VO = window.VO;
      const S0 = TM.s5[0], S1 = TM.s5[1];
      const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
      const W = (k, w, nth = 0) => {
        const alts = w.split("|");
        for (const exact of [true, false]) {
          let c = 0;
          for (const x of VO[k].words) {
            const t = norm(x.w);
            if (alts.some((a) => (exact ? t === a : t.startsWith(a)))) { if (c === nth) return x.t0 - S0; c++; }
          }
        }
        return VO[k].start - S0;
      };
      const tl = gsap.timeline({ paused: true });
      const rise = (el, t, d = 0.5, dy = 22) =>
        tl.fromTo(el, { opacity: 0, y: dy, filter: "blur(5px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: "power3.out" }, t - 0.04);
      const fade = (el, t, d = 0.4) => tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: d, ease: "power2.out" }, t);
      const out = (els, t, d = 0.3) => tl.to(els, { opacity: 0, filter: "blur(5px)", duration: d, ease: "power3.in" }, t);

      const ALL = ["#s5-kick", "#s5-num", "#s5-head .w", "#s5-note", ".s5-row"];
      gsap.set(ALL, { opacity: 0 });

      fade("#s5-kick", 0.15, 0.4);
      // 51 counts up as she says it, and lands on "tests"
      const n0 = W("v12", "51"), n1 = W("v12", "tests");
      const n = { v: 0 };
      tl.set("#s5-num", { opacity: 1 }, n0 - 0.05);
      tl.fromTo(n, { v: 0 }, {
        v: 51, duration: Math.max(0.3, n1 - n0), ease: "expo.out",
        onUpdate: () => { document.querySelector("#s5-num").textContent = String(Math.round(n.v)); },
      }, n0 - 0.05);
      rise("#s5-head .w:nth-child(1)", n1 - 0.04, 0.5, 18);
      rise("#s5-head .w:nth-child(3)", W("v12", "boundaries") - 0.04, 0.5, 18);
      tl.fromTo(".s5-row", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.2 }, W("v12", "pin") - 0.1);
      fade("#s5-note", W("v12", "place") + 0.45, 0.45);

      out(ALL, S1 - S0 - 1.0, 0.3);
      window.__timelines["s5-tests"] = tl;
    })();
  </script>
