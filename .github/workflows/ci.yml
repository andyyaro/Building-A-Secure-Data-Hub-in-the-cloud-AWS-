name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # No AWS calls: every boto3 client and the encryption SDK are patched. The
      # suite exists to pin security properties - the cross-account boundary, the
      # botocore session handed to KMS, the tenant key, the Scan projection, and
      # the committed IAM and API Gateway configuration.
      - name: Run tests
        run: pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      # Scans the working tree rather than full history, deliberately. An AWS
      # account id was committed early in this repository's life and later replaced
      # with a placeholder; history was left intact because an account id is an
      # identifier, not a credential, and rewriting published history to remove one
      # is not a proportionate trade. This job answers "is there a secret in the
      # repository as it stands today", which is the question that can still be
      # acted on.
      - name: Scan the working tree for credentials
        run: gitleaks detect --no-git --redact --verbose
